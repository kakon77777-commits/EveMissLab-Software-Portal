<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>JSON 工作臺 | EveMissLab</title><link rel="stylesheet" href="/tools/json/tool.css"><script src="/tools/json/tool.js" defer></script></head>
<body><header><a href="/">← 返回 Software Portal</a><span>EveMissLab · Browser Tools</span></header><main><div class="eyebrow">LOCAL-FIRST / DEVELOPER UTILITIES</div><h1>JSON 工作臺</h1><p class="hint">格式化、壓縮或驗證 JSON。內容只在你的瀏覽器記憶體中處理，不會由此工具上傳到伺服器。</p><div class="workspace"><section><div class="label-row"><label for="source">JSON 輸入</label><span id="input-size">0 字元</span></div><textarea id="source" spellcheck="false" placeholder='{"message":"Hello EveMissLab"}'></textarea><div class="controls"><button id="format" class="primary">格式化</button><button id="compact">壓縮</button><button id="validate">驗證</button><button id="sample">填入範例</button><button id="clear">清除</button></div></section><section><div class="label-row"><label for="result">處理結果</label><span id="output-size">0 字元</span></div><textarea id="result" readonly spellcheck="false" placeholder="處理結果會顯示在此處"></textarea><div class="controls"><button id="copy">複製結果</button><button id="save">下載 .json</button><label class="upload">讀取本機 JSON<input id="file" type="file" accept=".json,application/json"></label></div></section></div><div id="message" class="message" role="status" aria-live="polite">準備就緒 · 不記錄操作內容</div><div class="notice"><b>隱私提醒</b><p>工具不呼叫任何 API，也不儲存輸入資料。瀏覽器擴充套件及個人裝置的安全性仍須自行評估；請勿將敏感憑證貼到不受信任的環境。原生 JSON.parse 可能變更超大整數、重複鍵或資料簽章，重要數據不建議由此工具改寫。</p></div></main></body></html>
